
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福井県 企業情報一覧</title>
<style>
body {
  font-family: sans-serif;
  background: #f4f7fb;
  margin: 0;
  padding: 30px;
  color: #222;
}
main {
  max-width: 850px;
  margin: auto;
}
h1 { color: #234b76; }
input, select {
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
}
input { width: 100%; margin-bottom: 12px; }
select { width: 100%; margin-bottom: 20px; }
.company {
  background: white;
  padding: 18px;
  margin-bottom: 12px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #0001;
}
.company button {
  border: 0;
  background: none;
  color: #0866cc;
  font-size: 18px;
  cursor: pointer;
}
.detail { line-height: 1.8; }
[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>福井県 企業情報一覧</h1>
  <p>福井県に関係する企業を検索できます。</p>

  <input id="search" type="text"
    placeholder="企業名・住所・キーワードで検索">

  <select id="industry">
    <option value="">すべての業種</option>
    <option value="IT">IT・情報通信</option>
    <option value="金融">金融</option>
    <option value="小売">小売・流通</option>
  </select>

  <p id="count"></p>
  <div id="list"></div>
</main>
  <script>
const companies = [
  {
    name: "jig.jp",
    industry: "IT",
    address: "福井県鯖江市",
    info: "ソフトウェア・情報通信"
  },
  {
    name: "福井銀行",
    industry: "金融",
    address: "福井県福井市",
    info: "銀行・金融サービス"
  },
  {
    name: "ゲンキー",
    industry: "小売",
    address: "福井県を含む複数地域",
    info: "ドラッグストア"
  }
];
</script>
<script>
const address = document.createElement("p");
address.textContent = "所在地：" + company.address;

const type = document.createElement("p");
type.textContent = "業種：" + company.industry;

const info = document.createElement("p");
info.textContent = "企業情報：" + company.info;

detail.append(address, type, info);
</script>
