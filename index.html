<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>福井県 企業情報一覧</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }
    main {
      max-width: 850px;
      margin: auto;
    }
    h1 { color: #234b76; }
    input, select {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    input { width: 100%; margin-bottom: 12px; }
    select { width: 100%; margin-bottom: 20px; }
    .company {
      background: white;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    .company button {
      border: 0;
      background: none;
      color: #0866cc;
      font-size: 18px;
      cursor: pointer;
    }
    .detail { line-height: 1.8; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>福井県 企業情報一覧</h1>
    <p>福井県に関係する企業を検索できます。</p>

    <input id="search" type="text" placeholder="企業名・住所・キーワードで検索">

    <select id="industry">
      <option value="">すべての業種</option>
      <option value="IT">IT・情報通信</option>
      <option value="金融">金融</option>
      <option value="小売">小売・流通</option>
      <option value="製造">製造</option>
      <option value="建設">建設</option>
      <option value="医療">医療・福祉</option>
    </select>

    <p id="count"></p>
    <div id="list"></div>
  </main>

  <script>
    const companies = [
      {
        name: "jig.jp",
        industry: "IT",
        address: "福井県鯖江市",
        info: "ソフトウェア・情報通信"
      },
      {
        name: "福井銀行",
        industry: "金融",
        address: "福井県福井市",
        info: "銀行・金融サービス"
      },
      {
        name: "ゲンキー",
        industry: "小売",
        address: "福井県を含む複数地域",
        info: "ドラッグストア"
      },
      {
        name: "福井トヨタ自動車",
        industry: "小売",
        address: "福井県福井市",
        info: "自動車販売・サービス"
      },
      {
        name: "北陸電力",
        industry: "製造",
        address: "福井県福井市",
        info: "エネルギー・電力事業"
      },
      {
        name: "ダイハツ工業福井事業所",
        industry: "製造",
        address: "福井県あわら市",
        info: "自動車部品・製造"
      },
      {
        name: "福井県立病院",
        industry: "医療",
        address: "福井県福井市",
        info: "医療・福祉サービス"
      },
      {
        name: "福井建設",
        industry: "建設",
        address: "福井県越前市",
        info: "土木・建築工事"
      },
      {
        name: "エルハーモニー福井",
        industry: "医療",
        address: "福井県越前市",
        info: "介護・福祉施設"
      },
      {
        name: "福井観光開発",
        industry: "小売",
        address: "福井県坂井市",
        info: "観光・宿泊・旅行"
      },
      {
        name: "マルヨシセンター",
        industry: "小売",
        address: "福井県福井市",
        info: "スーパーマーケット"
      },
      {
        name: "明光ネットワーク",
        industry: "IT",
        address: "福井県大野市",
        info: "ITソリューション・通信"
      }
    ];

    const search = document.getElementById("search");
    const industry = document.getElementById("industry");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function showCompanies() {
      const keyword = search.value.trim().toLowerCase();
      const selected = industry.value;

      const filtered = companies.filter(company => {
        const text = [company.name, company.address, company.info].join(" ").toLowerCase();
        return text.includes(keyword) && (!selected || company.industry === selected);
      });

      list.replaceChildren();
      count.textContent = `${filtered.length}社の企業が見つかりました`;

      filtered.forEach(company => {
        const card = document.createElement("div");
        card.className = "company";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "＋ " + company.name;

        const detail = document.createElement("div");
        detail.className = "detail";
        detail.hidden = true;

        const address = document.createElement("p");
        address.textContent = "所在地：" + company.address;

        const type = document.createElement("p");
        type.textContent = "業種：" + company.industry;

        const info = document.createElement("p");
        info.textContent = "企業情報：" + company.info;

        detail.append(address, type, info);

        button.addEventListener("click", () => {
          detail.hidden = !detail.hidden;
          button.textContent = (detail.hidden ? "＋ " : "－ ") + company.name;
        });

        card.append(button, detail);
        list.append(card);
      });
    }

    search.addEventListener("input", showCompanies);
    industry.addEventListener("change", showCompanies);

    showCompanies();
  </script>
</body>
</html>
