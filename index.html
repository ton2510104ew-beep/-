<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>福井県 企業情報一覧</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    body {
      font-family: sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }
    main {
      max-width: 850px;
      margin: auto;
    }
    h1 { color: #234b76; }
    input, select {
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    input { width: 100%; margin-bottom: 12px; }
    select { width: 100%; margin-bottom: 20px; }
    #map {
      height: 420px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0001;
    }
    .company {
      background: white;
      padding: 18px;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    .company button {
      border: 0;
      background: none;
      color: #0866cc;
      font-size: 18px;
      cursor: pointer;
    }
    .detail { line-height: 1.8; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>福井県 企業情報一覧</h1>
    <p>福井県に関係する企業を検索できます。</p>

    <input id="search" type="text" placeholder="企業名・住所・キーワードで検索">

    <select id="industry">
      <option value="">すべての業種</option>
      <option value="IT">IT・情報通信</option>
      <option value="金融">金融</option>
      <option value="小売">小売・流通</option>
      <option value="製造">製造</option>
      <option value="建設">建設</option>
      <option value="医療">医療・福祉</option>
    </select>

    <div id="map"></div>
    <p id="count"></p>
    <div id="list"></div>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const companies = [
      {
        name: "jig.jp",
        industry: "IT",
        address: "福井県鯖江市",
        info: "ソフトウェア・情報通信",
        lat: 35.9551,
        lng: 136.1882
      },
      {
        name: "福井銀行",
        industry: "金融",
        address: "福井県福井市",
        info: "銀行・金融サービス",
        lat: 36.0625,
        lng: 136.2221
      },
      {
        name: "ゲンキー",
        industry: "小売",
        address: "福井県を含む複数地域",
        info: "ドラッグストア",
        lat: 36.0643,
        lng: 136.2179
      },
      {
        name: "福井トヨタ自動車",
        industry: "小売",
        address: "福井県福井市",
        info: "自動車販売・サービス",
        lat: 36.0644,
        lng: 136.2188
      },
      {
        name: "北陸電力",
        industry: "製造",
        address: "福井県福井市",
        info: "エネルギー・電力事業",
        lat: 36.0649,
        lng: 136.2231
      },
      {
        name: "ダイハツ工業福井事業所",
        industry: "製造",
        address: "福井県あわら市",
        info: "自動車部品・製造",
        lat: 36.2231,
        lng: 136.2009
      },
      {
        name: "福井県立病院",
        industry: "医療",
        address: "福井県福井市",
        info: "医療・福祉サービス",
        lat: 36.0656,
        lng: 136.2192
      },
      {
        name: "福井建設",
        industry: "建設",
        address: "福井県越前市",
        info: "土木・建築工事",
        lat: 35.9008,
        lng: 136.1668
      },
      {
        name: "エルハーモニー福井",
        industry: "医療",
        address: "福井県越前市",
        info: "介護・福祉施設",
        lat: 35.9016,
        lng: 136.1678
      },
      {
        name: "福井観光開発",
        industry: "小売",
        address: "福井県坂井市",
        info: "観光・宿泊・旅行",
        lat: 36.1569,
        lng: 136.1716
      },
      {
        name: "マルヨシセンター",
        industry: "小売",
        address: "福井県福井市",
        info: "スーパーマーケット",
        lat: 36.0671,
        lng: 136.2147
      },
      {
        name: "明光ネットワーク",
        industry: "IT",
        address: "福井県大野市",
        info: "ITソリューション・通信",
        lat: 35.9821,
        lng: 136.4896
      }
    ];

    const search = document.getElementById("search");
    const industry = document.getElementById("industry");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    const map = L.map("map").setView([36.065, 136.22], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    function updateMap(filtered) {
      map.eachLayer((layer) => {
        if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
          map.removeLayer(layer);
        }
      });

      filtered.forEach(company => {
        const marker = L.marker([company.lat, company.lng]).addTo(map);
        marker.bindPopup(`
          <strong>${company.name}</strong><br>
          ${company.industry}<br>
          ${company.address}
        `);
      });

      if (filtered.length > 0) {
        const bounds = filtered.map(company => [company.lat, company.lng]);
        map.fitBounds(bounds, { padding: [30, 30] });
      } else {
        map.setView([36.065, 136.22], 10);
      }
    }

    function showCompanies() {
      const keyword = search.value.trim().toLowerCase();
      const selected = industry.value;

      const filtered = companies.filter(company => {
        const text = [company.name, company.address, company.info].join(" ").toLowerCase();
        return text.includes(keyword) && (!selected || company.industry === selected);
      });

      list.replaceChildren();
      count.textContent = `${filtered.length}社の企業が見つかりました`;
      updateMap(filtered);

      filtered.forEach(company => {
        const card = document.createElement("div");
        card.className = "company";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "＋ " + company.name;

        const detail = document.createElement("div");
        detail.className = "detail";
        detail.hidden = true;

        const address = document.createElement("p");
        address.textContent = "所在地：" + company.address;

        const type = document.createElement("p");
        type.textContent = "業種：" + company.industry;

        const info = document.createElement("p");
        info.textContent = "企業情報：" + company.info;

        detail.append(address, type, info);

        button.addEventListener("click", () => {
          detail.hidden = !detail.hidden;
          button.textContent = (detail.hidden ? "＋ " : "－ ") + company.name;
        });

        card.append(button, detail);
        list.append(card);
      });
    }

    search.addEventListener("input", showCompanies);
    industry.addEventListener("change", showCompanies);

    showCompanies();
  </script>
</body>
</html>
